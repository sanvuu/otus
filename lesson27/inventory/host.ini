[routers]
inetRouter      ansible_host=127.0.0.1 ansible_port=2222 ansible_user=vagrant ansible_ssh_private_key_file=.vagrant/machines/inetRouter/libvirt/private_key
centralRouter   ansible_host=127.0.0.1 ansible_port=2200 ansible_user=vagrant ansible_ssh_private_key_file=.vagrant/machines/centralRouter/libvirt/private_key
office1Router   ansible_host=127.0.0.1 ansible_port=2202 ansible_user=vagrant ansible_ssh_private_key_file=.vagrant/machines/office1Router/libvirt/private_key
office2Router   ansible_host=127.0.0.1 ansible_port=2204 ansible_user=vagrant ansible_ssh_private_key_file=.vagrant/machines/office2Router/libvirt/private_key

[servers]
centralServer   ansible_host=127.0.0.1 ansible_port=2206 ansible_user=vagrant ansible_ssh_private_key_file=.vagrant/machines/centralServer/libvirt/private_key
office1Server   ansible_host=127.0.0.1 ansible_port=2208 ansible_user=vagrant ansible_ssh_private_key_file=.vagrant/machines/office1Server/libvirt/private_key
office2Server   ansible_host=127.0.0.1 ansible_port=2210 ansible_user=vagrant ansible_ssh_private_key_file=.vagrant/machines/office2Server/libvirt/private_key

[all:vars]
ansible_ssh_common_args='-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null'
