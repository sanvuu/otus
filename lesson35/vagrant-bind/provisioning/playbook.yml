---
- hosts: all
  become: yes
  tasks:
    - name: Install packages
      yum:
        name:
          - bind
          - bind-utils
          - policycoreutils-python
        state: present

    - name: Ensure chronyd is running and enabled
      service:
        name: chronyd
        state: started
        enabled: yes

    - name: Copy transferkey to all hosts
      copy:
        src: named.zonetransfer.key
        dest: /etc/named.zonetransfer.key
        owner: root
        group: named
        mode: 0644

- hosts: ns01
  become: yes
  tasks:
    - name: Copy master named.conf
      copy:
        src: master-named.conf
        dest: /etc/named.conf
        owner: root
        group: named
        mode: 0640

    - name: Copy zone files
      copy:
        src: "{{ item }}"
        dest: /etc/named/
        owner: root
        group: named
        mode: 0660
      loop:
        - named.ddns.lab
        - named.dns.lab
        - named.dns.lab.client
        - named.dns.lab.rev
        - named.newdns.lab

    - name: Set /etc/named permissions
      file:
        path: /etc/named
        owner: root
        group: named
        mode: 0670

    - name: Restore SELinux context on /etc/named
      command: restorecon -Rv /etc/named /etc/named.conf

    - name: Copy resolv.conf to ns01
      template:
        src: servers-resolv.conf.j2
        dest: /etc/resolv.conf
        owner: root
        group: root
        mode: 0644

    - name: Ensure named is running and enabled
      service:
        name: named
        state: restarted
        enabled: yes

- hosts: ns02
  become: yes
  tasks:
    - name: Copy slave named.conf
      copy:
        src: slave-named.conf
        dest: /etc/named.conf
        owner: root
        group: named
        mode: 0640

    - name: Set /etc/named permissions
      file:
        path: /etc/named
        owner: root
        group: named
        mode: 0670

    - name: Restore SELinux context on /etc/named.conf
      command: restorecon -v /etc/named.conf

    - name: Copy resolv.conf to ns02
      template:
        src: servers-resolv.conf.j2
        dest: /etc/resolv.conf
        owner: root
        group: root
        mode: 0644

    - name: Ensure named is running and enabled
      service:
        name: named
        state: restarted
        enabled: yes

- hosts: client,client2
  become: yes
  tasks:
    - name: Copy resolv.conf to clients
      copy:
        src: client-resolv.conf
        dest: /etc/resolv.conf
        owner: root
        group: root
        mode: 0644

    - name: Copy rndc conf file
      copy:
        src: rndc.conf
        dest: /home/vagrant/rndc.conf
        owner: vagrant
        group: vagrant
        mode: 0644

    - name: Copy motd to clients
      copy:
        src: client-motd
        dest: /etc/motd
        owner: root
        group: root
        mode: 0644
